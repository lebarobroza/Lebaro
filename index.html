<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lebato Pro Translation Suite</title>
    <style>
        :root {
            --bg-primary: #0f172a;
            --bg-secondary: #1e293b;
            --bg-input: #0b0f19;
            --accent: #38bdf8;
            --accent-hover: #0ea5e9;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border: #334155;
            --error: #ef4444;
            --success: #10b981;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-primary);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            padding: 16px;
        }

        header {
            text-align: center;
            margin: 24px 0;
        }

        header h1 {
            font-size: 1.75rem;
            font-weight: 700;
            letter-spacing: -0.025em;
            color: var(--text-main);
            margin-bottom: 6px;
        }

        header h1 span {
            color: var(--accent);
        }

        header p {
            color: var(--text-muted);
            font-size: 0.875rem;
        }

        main {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            max-width: 1000px;
            margin: 0 auto;
        }

        .workspace {
            width: 100%;
            background-color: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 24px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3), 0 8px 10px -6px rgba(0, 0, 0, 0.3);
        }

        .control-panel {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background-color: var(--bg-input);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 12px 16px;
            margin-bottom: 20px;
        }

        .lang-label {
            font-size: 0.9rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-muted);
        }

        .lang-label.active-lang {
            color: var(--accent);
        }

        .swap-btn {
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            padding: 8px;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }

        .swap-btn:hover {
            color: var(--accent);
            background-color: rgba(56, 189, 248, 0.1);
        }

        .translation-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }

        .panel-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .panel-header {
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        textarea {
            width: 100%;
            height: 200px;
            background-color: var(--bg-input);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text-main);
            padding: 16px;
            font-size: 1rem;
            line-height: 1.5;
            resize: none;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        textarea:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 2px rgba(56, 189, 248, 0.2);
        }

        .output-box {
            width: 100%;
            height: 200px;
            background-color: var(--bg-input);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text-main);
            padding: 16px;
            font-size: 1rem;
            line-height: 1.5;
            overflow-y: auto;
            white-space: pre-wrap;
            transition: all 0.2s;
        }

        .output-box.has-error {
            border-color: var(--error);
            background-color: rgba(239, 68, 68, 0.05);
            color: #fca5a5;
        }

        .action-bar {
            display: flex;
            gap: 12px;
            justify-content: flex-end;
        }

        .btn {
            background-color: var(--accent);
            color: var(--bg-primary);
            border: none;
            padding: 12px 24px;
            font-size: 0.95rem;
            font-weight: 600;
            border-radius: 6px;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: opacity 0.2s;
            user-select: none;
        }

        .btn:hover {
            opacity: 0.9;
        }

        .btn-outline {
            background-color: transparent;
            color: var(--accent);
            border: 1px solid var(--border);
        }

        .btn-outline:hover {
            background-color: rgba(56, 189, 248, 0.05);
            border-color: var(--accent);
        }

        /* Mobile Responsive Adjustments */
        @media (max-width: 768px) {
            .translation-grid {
                grid-template-columns: 1fr;
                gap: 16px;
            }
            
            textarea, .output-box {
                height: 160px;
            }

            .action-bar {
                flex-direction: column-reverse;
            }

            .btn {
                width: 100%;
                justify-content: center;
                padding: 14px;
            }

            .workspace {
                padding: 16px;
            }
        }

        footer {
            text-align: center;
            margin-top: 24px;
            font-size: 0.75rem;
            color: var(--text-muted);
        }

        /* Modal styling */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(15, 23, 42, 0.8);
            backdrop-filter: blur(4px);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            padding: 16px;
        }

        .modal-overlay.is-active {
            display: flex;
        }

        .modal-card {
            background-color: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: 12px;
            width: 100%;
            max-width: 650px;
            max-height: 85vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
        }

        .modal-title-bar {
            padding: 16px 20px;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .modal-title {
            font-size: 1.1rem;
            font-weight: 600;
        }

        .close-btn {
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 1.5rem;
            cursor: pointer;
            padding: 4px;
            border-radius: 4px;
            line-height: 1;
        }

        .close-btn:hover {
            color: var(--text-main);
        }

        .search-container {
            padding: 12px 20px;
            border-bottom: 1px solid var(--border);
            background-color: var(--bg-input);
        }

        .search-container input {
            width: 100%;
            padding: 10px 14px;
            background-color: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: 6px;
            color: var(--text-main);
            outline: none;
            font-size: 0.95rem;
        }

        .search-container input:focus {
            border-color: var(--accent);
        }

        .dictionary-scroll {
            padding: 20px;
            overflow-y: auto;
            flex: 1;
        }

        .cat-header {
            font-size: 0.85rem;
            font-weight: 700;
            color: var(--accent);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin: 20px 0 10px 0;
            padding-bottom: 4px;
            border-bottom: 1px solid rgba(56, 189, 248, 0.2);
        }

        .cat-header:first-child {
            margin-top: 0;
        }

        .word-table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 10px;
        }

        .word-table th, .word-table td {
            padding: 10px 12px;
            text-align: left;
            font-size: 0.95rem;
        }

        .word-table th {
            color: var(--text-muted);
            font-size: 0.8rem;
            text-transform: uppercase;
            font-weight: 600;
            border-bottom: 1px solid var(--border);
        }

        .word-table td {
            border-bottom: 1px solid rgba(51, 65, 85, 0.5);
        }

        .word-table tr:last-child td {
            border-bottom: none;
        }

        .word-table .le-word {
            font-weight: 600;
            color: var(--accent);
        }
    </style>
</head>
<body>

    <header>
        <h1>Lebato<span>Suite</span></h1>
        <p>Интеллектуальная система синхронного перевода</p>
    </header>

    <main>
        <div class="workspace">
            <div class="control-panel">
                <span class="lang-label active-lang" id="lbl-source">Русский</span>
                <button class="swap-btn" id="btn-swap" title="Изменить направление перевода">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 3L21 7L17 11"/><path d="M3 7H21"/><path d="M7 21L3 17L7 13"/><path d="M21 17H3"/></svg>
                </button>
                <span class="lang-label" id="lbl-target">Лебато Броза</span>
            </div>

            <div class="translation-grid">
                <div class="panel-group">
                    <label class="panel-header" for="input-text">Исходный текст</label>
                    <textarea id="input-text" placeholder="Введите текст для верификации и перевода..."></textarea>
                </div>
                <div class="panel-group">
                    <div class="panel-header">Результат перевода</div>
                    <div class="output-box" id="output-text">Ожидание ввода...</div>
                </div>
            </div>

            <div class="action-bar">
                <button class="btn btn-outline" id="btn-open-dict">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
                    Реестр терминов (Словарь)
                </button>
                <button class="btn" id="btn-translate">
                    Выполнить перевод
                </button>
            </div>
        </div>
    </main>

    <div class="modal-overlay" id="dict-modal">
        <div class="modal-card">
            <div class="modal-title-bar">
                <div class="modal-title">Корпоративный словарь языка Лебато Броза</div>
                <button class="close-btn" id="btn-close-dict">&times;</button>
            </div>
            <div class="search-container">
                <input type="text" id="dict-search" placeholder="Поиск точных совпадений или корней слов...">
            </div>
            <div class="dictionary-scroll" id="dict-content">
                </div>
        </div>
    </div>

    <footer>
        &copy; 2026 Lebato Translation Enterprise. Все права защищены. Strict Mode v2.4.
    </footer>

    <script>
        document.addEventListener("DOMContentLoaded", function() {
            const dictionary = {
                "Основные выражения": [
                    { ru: "здравствуйте", le: "тапули" },
                    { ru: "привет", le: "тапули" },
                    { ru: "до свидания", le: "пидадо" },
                    { ru: "пока", le: "пидадо" },
                    { ru: "меня зовут", le: "милетики панука" },
                    { ru: "друг", le: "тифтарик" },
                    { ru: "друн", le: "тифтарик" },
                    { ru: "ау", le: "ластунья" },
                    { ru: "автограф", le: "облигата" },
                    { ru: "слава аруту", le: "слава аруту" },
                    { ru: "да", le: "май" },
                    { ru: "нет", le: "нээз" }
                ],
                "Транки Софтеры (Семья)": [
                    { ru: "мама", le: "момо" },
                    { ru: "папа", le: "попо" },
                    { ru: "брат", le: "брот" },
                    { ru: "сестра", le: "состро" },
                    { ru: "бабушка", le: "бобошко" },
                    { ru: "дедушка", le: "додошко" },
                    { ru: "дядя", le: "додо" },
                    { ru: "тётя", le: "тото" },
                    { ru: "сын", le: "иоплнисир" },
                    { ru: "дочь", le: "гуч" },
                    { ru: "зять", le: "пятёрик" },
                    { ru: "шурин", le: "олдсплайс" }
                ],
                "Флюки (Цвета)": [
                    { ru: "красный", le: "крбжондель" },
                    { ru: "оранжевый", le: "олида" },
                    { ru: "жёлтый", le: "жирость" },
                    { ru: "зелёный", le: "злобень" },
                    { ru: "голубой", le: "голики" },
                    { ru: "синий", le: "сирунчики" },
                    { ru: "фиолетовый", le: "фармацевтика" },
                    { ru: "белый", le: "бэнтэн" },
                    { ru: "чёрный", le: "чиривички" },
                    { ru: "нежно-малиновый", le: "сыр" }
                ],
                "Минуни (Местоимения)": [
                    { ru: "я", le: "зю" },
                    { ru: "мы", le: "зюзя" },
                    { ru: "ты", le: "зюк" },
                    { ru: "вы", le: "зюки" },
                    { ru: "он", le: "зь" },
                    { ru: "она", le: "зь" },
                    { ru: "они", le: "зь" },
                    { ru: "ихний", le: "зозойни" },
                    { ru: "евоный", le: "зазайны" }
                ],
                "Зондби (Классификация матюков)": [
                    { ru: "хуй", le: "транки" },
                    { ru: "пидор", le: "негодник" },
                    { ru: "уёбок", le: "подлец" },
                    { ru: "сын шлюхи", le: "тифтарьик" },
                    { ru: "блять", le: "ћ" },
                    { ru: "ебать", le: "транкерить" },
                    { ru: "сука", le: "зика" },
                    { ru: "долбоёб", le: "топик" },
                    { ru: "хуесос", le: "транквилизатор" }
                ],
                "Корпи (Предметы одежды)": [
                    { ru: "штаны", le: "лоберты" },
                    { ru: "кроссовки", le: "алепон" },
                    { ru: "майка", le: "букаке" },
                    { ru: "футболка", le: "букаке" },
                    { ru: "шарф", le: "рунек" },
                    { ru: "толстовка", le: "доргана" },
                    { ru: "носок", le: "влияк" },
                    { ru: "куртка", le: "увяжа" },
                    { ru: "шапка", le: "корстакар" }
                ],
                "Люкены ваки (Интерьер)": [
                    { ru: "кровать", le: "лорим" },
                    { ru: "микроволновка", le: "миктра" },
                    { ru: "зубная щётка", le: "зублан" },
                    { ru: "лампа", le: "лумар" },
                    { ru: "холодильник", le: "фрисол" },
                    { ru: "стол", le: "табрес" },
                    { ru: "чайник", le: "кетора" },
                    { ru: "зеркало", le: "жако" }
                ],
                "Устойчивые идиомы": [
                    { ru: "лекарня", le: "хаммам" },
                    { ru: "спасибо, хорошо", le: "микулик, бе" },
                    { ru: "столица", le: "мурино" },
                    { ru: "хлыст хлыст", le: "бэм бэм бэм чэм чэм чэм чэм чэм" },
                    { ru: "я уже красный", le: "зю ежу крыжондель" },
                    { ru: "о май гад", le: "у зюзин арут" },
                    { ru: "привет артур", le: "тапули арут" },
                    { ru: "сливы", le: "сюси" },
                    { ru: "заново", le: "монамур" },
                    { ru: "начало", le: "монамур" },
                    { ru: "спасибо", le: "микулик" },
                    { ru: "подходи", le: "чипиндэ" },
                    { ru: "выходи", le: "чипиндэ" },
                    { ru: "пожалуйста", le: "августина" },
                    { ru: "внимание", le: "бикаса" },
                    { ru: "мне это не нравится", le: "бла бла бла бла" },
                    { ru: "не приятно", le: "бла бла бла" }
                ],
                "Числа и Символы": [
                    { ru: "1", le: "го" },
                    { ru: "2", le: "ми" },
                    { ru: "3", le: "ки" },
                    { ru: "4", le: "банбан" },
                    { ru: "5", le: "зять" },
                    { ru: "6", le: "жопа" },
                    { ru: "7", le: "ебанутая" },
                    { ru: "8", le: "гофра" },
                    { ru: "9", le: "апож" },
                    { ru: "10", le: "зернадцать" },
                    { ru: "+", le: "алифак" },
                    { ru: "-", le: "факали" },
                    { ru: "*", le: "мегаплях" },
                    { ru: "/", le: "дудоплях" },
                    { ru: "корень", le: "киш" },
                    { ru: "%", le: "динах" }
                ]
            };

            let ruToLeMap = {};
            let leToRuMap = {};

            for (let cat in dictionary) {
                dictionary[cat].forEach(item => {
                    ruToLeMap[item.ru.toLowerCase()] = item.le;
                    leToRuMap[item.le.toLowerCase()] = item.ru;
                });
            }

            let isRuToLe = true;

            const inputText = document.getElementById('input-text');
            const outputText = document.getElementById('output-text');
            const translateBtn = document.getElementById('btn-translate');
            const swapBtn = document.getElementById('btn-swap');
            const lblSource = document.getElementById('lbl-source');
            const lblTarget = document.getElementById('lbl-target');
            
            const dictModal = document.getElementById('dict-modal');
            const openDictBtn = document.getElementById('btn-open-dict');
            const closeDictBtn = document.getElementById('btn-close-dict');
            const searchInput = document.getElementById('dict-search');
            const dictContent = document.getElementById('dict-content');

            function performTranslation() {
                const text = inputText.value.trim();
                if (!text) {
                    outputText.innerText = "Ожидание ввода...";
                    outputText.classList.remove('has-error');
                    return;
                }

                const currentMap = isRuToLe ? ruToLeMap : leToRuMap;
                const lowerText = text.toLowerCase();
                
                // Проверка на полное совпадение фразы
                if (currentMap[lowerText]) {
                    outputText.innerText = currentMap[lowerText];
                    outputText.classList.remove('has-error');
                    return;
                }

                // Пословный разбор с валидацией
                let structuralTokens = text.split(/(\s+|,|\.|\!|\?|:|-)/);
                let compiledResult = [];
                let errorFound = false;
                let missingWord = "";

                for (let i = 0; i < structuralTokens.length; i++) {
                    let token = structuralTokens[i];
                    let cleanToken = token.trim();
                    
                    if (!cleanToken) {
                        compiledResult.push(token); // сохраняем пробелы
                        continue;
                    }

                    // Отделяем знаки препинания если прилипли
                    let lookup = cleanToken.replace(/[\.,\?\!:-]/g, "").toLowerCase();
                    let punctuation = cleanToken.match(/[\.,\?\!:-]+/);

                    if (!lookup) {
                        compiledResult.push(token);
                        continue;
                    }

                    if (currentMap[lookup]) {
                        let translated = currentMap[lookup];
                        compiledResult.push(translated + (punctuation ? punctuation[0] : ""));
                    } else {
                        errorFound = true;
                        missingWord = lookup;
                        break;
                    }
                }

                if (errorFound) {
                    outputText.innerText = `⚠️ КРИТИЧЕСКАЯ ОШИБКА СИНТАКСИСА:\nСлово "${missingWord}" отсутствует в текущем корпоративном реестре Lebato Suite. Перевод не может быть завершен.`;
                    outputText.className = 'output-box has-error';
                } else {
                    outputText.innerText = compiledResult.join("");
                    outputText.className = 'output-box';
                }
            }

            // Переключение направления
            swapBtn.addEventListener('click', () => {
                isRuToLe = !isRuToLe;
                if (isRuToLe) {
                    lblSource.innerText = "Русский";
                    lblSource.classList.add('active-lang');
                    lblTarget.innerText = "Лебато Броза";
                    lblTarget.classList.remove('active-lang');
                    inputText.placeholder = "Введите текст для верификации и перевода...";
                } else {
                    lblSource.innerText = "Лебато Броза";
                    lblSource.classList.remove('active-lang');
                    lblTarget.innerText = "Русский";
                    lblTarget.classList.add('active-lang');
                    inputText.placeholder = "Введите текст на Лебато Броза для обратного декодирования...";
                }
                
                let currentInput = inputText.value;
                if (outputText.innerText && !outputText.classList.contains('has-error') && outputText.innerText !== "Ожидание ввода...") {
                    inputText.value = outputText.innerText;
                } else {
                    inputText.value = "";
                }
                outputText.innerText = currentInput ? "Выполняется реверс..." : "Ожидание ввода...";
                outputText.classList.remove('has-error');
                performTranslation();
            });

            translateBtn.addEventListener('click', performTranslation);
            inputText.addEventListener('input', performTranslation);

            // Рендеринг словаря
            function renderDictData(filterText = "") {
                dictContent.innerHTML = "";
                const query = filterText.toLowerCase().trim();

                for (let category in dictionary) {
                    let matches = dictionary[category].filter(item => 
                        item.ru.toLowerCase().includes(query) || item.le.toLowerCase().includes(query)
                    );

                    if (matches.length === 0) continue;

                    let catHeader = document.createElement('div');
                    catHeader.className = 'cat-header';
                    catHeader.innerText = category;
                    dictContent.appendChild(catHeader);

                    let table = document.createElement('table');
                    table.className = 'word-table';
                    table.innerHTML = `
                        <thead>
                            <tr>
                                <th style="width: 50%;">Оригинал (RU)</th>
                                <th style="width: 50%;">Термин (LEBATO)</th>
                            </tr>
                        </thead>
                        <tbody></tbody>
                    `;

                    let tbody = table.querySelector('tbody');
                    matches.forEach(item => {
                        let row = document.createElement('tr');
                        row.innerHTML = `
                            <td>${item.ru}</td>
                            <td class="le-word">${item.le}</td>
                        `;
                        tbody.appendChild(row);
                    });

                    dictContent.appendChild(table);
                }

                if (dictContent.innerHTML === "") {
                    dictContent.innerHTML = "<p style='color: var(--text-muted); text-align: center; padding: 20px;'>Совпадений в базе данных не обнаружено</p>";
                }
            }

            // Управление модальным окном
            openDictBtn.addEventListener('click', () => {
                dictModal.classList.add('is-active');
                renderDictData();
            });

            closeDictBtn.addEventListener('click', () => {
                dictModal.classList.remove('is-active');
            });

            dictModal.addEventListener('click', (e) => {
                if (e.target === dictModal) dictModal.classList.remove('is-active');
            });

            searchInput.addEventListener('input', (e) => {
                renderDictData(e.target.value);
            });
        });
    </script>
</body>
</html>
